    <style>
        body {
            font-family: 'Gowun Dodum', sans-serif;
        }

        /* Light Mode Cute Dot Pattern */
        body.light-mode {
            background-color: #FFFDF9;
            background-image: radial-gradient(#F3E8FF 1.5px, transparent 1.5px), radial-gradient(#FFE8E5 1.5px, #FFFDF9 1.5px);
            background-size: 36px 36px;
            background-position: 0 0, 18px 18px;
        }

        /* Dark Mode Dot Pattern */
        body.dark {
            background-color: #12141C;
            background-image: radial-gradient(#2E3448 1.5px, transparent 1.5px), radial-gradient(#1E2230 1.5px, #12141C 1.5px);
            background-size: 36px 36px;
            background-position: 0 0, 18px 18px;
        }

        /* Animations */
        .bounce-hover {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
        }
        .bounce-hover:hover {
            transform: translateY(-2px) scale(1.02);
        }
        .bounce-click:active {
            transform: scale(0.95);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-7px) rotate(2deg); }
        }
        .animate-float {
            animation: float 3.5s ease-in-out infinite;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFD3CD;
            border-radius: 99px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #3B4259;
        }

        /* Chat Markdown Styles */
        .chat-content p { margin-bottom: 0.5rem; }
        .chat-content p:last-child { margin-bottom: 0; }
        .chat-content ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.5rem; }
        .chat-content ol { list-style-type: decimal; margin-left: 1.25rem; margin-bottom: 0.5rem; }
        .chat-content code {
            background-color: rgba(255, 142, 128, 0.18);
            padding: 0.15rem 0.35rem;
            border-radius: 0.375rem;
            font-size: 0.85em;
            font-family: monospace;
        }
        .dark .chat-content code {
            background-color: rgba(255, 255, 255, 0.18);
        }
        .chat-content pre {
            background-color: #1E2230;
            color: #F3F4F6;
            padding: 0.75rem;
            border-radius: 0.75rem;
            overflow-x: auto;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            position: relative;
        }

        /* Typing Dots Animation */
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: translateY(0); opacity: 0.4; }
            50% { transform: translateY(-4px); opacity: 1; }
        }

        /* Hide scrollbars for chips */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

                    "오늘의 몽글이 추천 메뉴! 🍱\n✨ **따뜻한 국물**: 가쓰오 우동이나 칼칼한 김치찌개\n✨ **든든한 한 끼**: 바삭한 돈가스나 비빔밥\n✨ **간편한 신메뉴**: 떡볶이와 튀김 조합!\n{user}님은 어떤 스타일이 당기시나요?",
                    "배고플 땐 역시 맛있는 걸 먹어야 행복하죠! 🍕 오늘 저녁은 파스타나 고소한 삼겹살 어떠신가요? 맛있는 음식으로 힐링하세요!",
                    "음, 몽글이의 원픽은 달콤 고소한 계란볶음밥이에요! 아니면 속이 든든해지는 포근한 뚝배기 국밥도 추천드려요 🐾"
                ]
            },
            {
                keywords: ['날씨', '비', '눈', '춥다', '덥다', '바람', '우산'],
                replies: [
                    "오늘 날씨 체크해보셨나요? ☀️ 외출하실 때는 감기 걸리지 않게 옷차림 신경 쓰시고, 혹시 모르니 작은 접이식 우산도 챙기시면 좋답니다!",
                    "바람이나 날씨가 차가울 땐 따뜻한 음료가 최고죠! ☕️ {user}님, 오늘 외출하실 때 따뜻하게 입으셨나요?",
                    "포근포근한 날씨처럼 {user}님의 마음에도 따사로운 햇살이 가득하기를 바랄게요 🌸"
                ]
            },
            {
                keywords: ['퀴즈', '문제', '심심', '놀자', '게임', '넌센스'],
                replies: [
                    "재미있는 넌센스 퀴즈 하나 나갑니다! 💡\n**Q. 세상에서 가장 슬픈 파는 무슨 파일까요?**\n\n(정답을 아시겠다면 아무 말이나 입력해보세요! 정답: '파X' 또는 '대파'?) 🤭",
                    "심심할 땐 몽글이랑 스피드 퀴즈! 💡\n**Q. 왕이 넘어지면 뭐가 될까요?**\n\n정답은 바로... **'킹콩'**입니다!! 히히 😆 재미있으셨나요?",
                    "심심하시군요! 그렇다면 몽글이가 깜짝 상식 퀴즈 내볼게요 ✏️\n**Q. 세계에서 가장 큰 바다는 어디일까요?**\n(힌트: 太平洋)"
                ]
            },
            {
                keywords: ['칭찬', '멋져', '최고', '귀여워', '고마워', '감사', '좋아'],
                replies: [
                    "헤헤, 그렇게 말씀해주시니 몽글이 마음이 살랑살랑 기뻐요! 🥰 {user}님 덕분에 오늘 하루가 훨씬 행복해졌어요 🌸",
                    "고마워요 {user}님! {user}님이야말로 정말 다정하고 따뜻한 분이에요 ✨ 몽글이는 언제나 {user} 편인 거 아시죠?",
                    "몽글이도 {user}님이 정말 좋아요! 🐾 언제든 이야기를 나누고 싶을 때 찾아와주세요!"
                ]
            },
            {
                keywords: ['공부', '시험', '숙제', '과제', '일', '야근', '자격증'],
                replies: [
                    "열심히 달려가고 계신 {user}님 정말 대단해요! 👏 하지만 연속해서 공부하거나 일하면 효율이 떨어지니 50분 일하고 10분은 꼭 눈을 식혀주세요!",
                    "포기하지 않고 노력하는 과정 자체가 이미 멋진 결실이에요. {user}님의 노력이 꼭 빛을 발할 거예요! 몽글이가 열렬히 응원할게요 🔥",
                    "자물쇠도 열쇠가 있듯 차분하게 해결하면 다 풀릴 거예요! 조급해하지 말고 잠시 스트레칭 한 번 해주세요 🧘‍♂️"
                ]
            },
            {
                keywords: ['비밀', '고민', '이야기', '상담', '말못할'],
                replies: [
                    "몽글이에게는 어떤 비밀 이야기든 안심하고 털어놓으셔도 돼요. 🔒 절대 어디에도 말하지 않는 든든한 비밀 친구가 되어드릴게요.",
                    "속에만 담아두면 마음이 아파요. 몽글이에게 가볍게 불평해보는 것도 좋아요. 다 들어드릴게요 🧸",
                    "언제나 이곳에서 {user}님의 이야기를 들을 준비가 되어 있답니다. 편하게 말씀해주세요."
                ]
            }
        ];

        // Generic Dynamic Fallback Templates to ensure never repetitive
        const FALLBACK_TEMPLATES = [
            "그렇군요! {user}님의 말씀을 듣다 보니 정말 흥미로워요. 🌸 혹시 이에 대해 더 나누고 싶은 이야기가 있으신가요?",
            "{user}님과 대화하는 시간은 늘 포근하고 즐거워요 🐾 방금 하신 말씀에 대해 몽글이도 깊이 생각해보게 되네요!",
            "아하! {user}님의 말씀 속에 깊은 뜻이 담겨 있군요 ✨ 오늘 다른 재미있는 일이나 고민은 없으셨나요?",
            "몽글이는 항상 {user}님의 이야기를 경청하고 있어요 🧸 더 자세한 이야기나 다른 질문이 있다면 언제든 편하게 말해줘요!",
            "와우, 정말 좋은 주제네요! 🐾 {user}님의 생각을 들을 수 있어서 기뻐요. 오늘도 기분 좋은 일들만 가득했으면 좋겠어요!"
        ];

        // Global State
        let currentCharacter = CHARACTERS[0];
        let chatHistory = [];
        let isDarkMode = false;
        let userName = '몽글이친구';
        let isGenerating = false;

        // DOM Elements
        const characterList = document.getElementById('characterList');
        const activeCharAvatar = document.getElementById('activeCharAvatar');
        const activeCharName = document.getElementById('activeCharName');
        const activeCharDesc = document.getElementById('activeCharDesc');
        const chatMessages = document.getElementById('chatMessages');
        const suggestionChips = document.getElementById('suggestionChips');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const userNameInput = document.getElementById('userNameInput');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const newChatBtn = document.getElementById('newChatBtn');

        // Sidebar Elements
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const openSidebarBtn = document.getElementById('openSidebarBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');

        // Modal Elements
        const codeModal = document.getElementById('codeModal');
        const openCodeModalBtn = document.getElementById('openCodeModalBtn');
        const closeCodeModalBtn = document.getElementById('closeCodeModalBtn');
        const copyCodeBtn = document.getElementById('copyCodeBtn');
        const codeDisplayArea = document.getElementById('codeDisplayArea');

        // Init App
        window.addEventListener('DOMContentLoaded', () => {
            renderCharacterList();
            setupEventListeners();
            loadInitialChat();
            lucide.createIcons();
        });

        function setupEventListeners() {
            // Sidebar logic
            openSidebarBtn.addEventListener('click', () => {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            });

            closeSidebarBtn.addEventListener('click', closeSidebar);
            sidebarOverlay.addEventListener('click', closeSidebar);

            function closeSidebar() {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }

            // Theme Switcher
            themeToggleBtn.addEventListener('click', () => {
                isDarkMode = !isDarkMode;
                if (isDarkMode) {
                    document.body.classList.remove('light-mode');
                    document.body.classList.add('dark');
                    themeIcon.innerText = '☀️';
                    themeText.innerText = '라이트 모드로 전환';
                } else {
                    document.body.classList.remove('dark');
                    document.body.classList.add('light-mode');
                    themeIcon.innerText = '🌙';
                    themeText.innerText = '다크 모드로 전환';
                }
            });

            // User Name Sync
            userNameInput.addEventListener('change', (e) => {
                userName = e.target.value.trim() || '몽글이친구';
            });

            // Reset Chat
            clearChatBtn.addEventListener('click', () => {
                chatHistory = [];
                renderMessages();
                addWelcomeMessage();
            });

            newChatBtn.addEventListener('click', () => {
                chatHistory = [];
                renderMessages();
                addWelcomeMessage();
                closeSidebar();
            });

            // Code Modal Events
            openCodeModalBtn.addEventListener('click', () => {
                codeDisplayArea.textContent = document.documentElement.outerHTML;
                codeModal.classList.remove('hidden');
            });

            closeCodeModalBtn.addEventListener('click', () => {
                codeModal.classList.add('hidden');
            });

            copyCodeBtn.addEventListener('click', () => {
                const fullCode = document.documentElement.outerHTML;
                navigator.clipboard.writeText(fullCode).then(() => {
                    copyCodeBtn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i><span>복사 완료! ✨</span>`;
                    lucide.createIcons();
                    setTimeout(() => {
                        copyCodeBtn.innerHTML = `<i data-lucide="copy" class="w-4 h-4"></i><span>코드 전체 복사하기</span>`;
                        lucide.createIcons();
                    }, 2000);
                });
            });

            // Auto Expand Textarea
            userInput.addEventListener('input', () => {
                userInput.style.height = 'auto';
                userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
            });

            // Submit Chat Form
            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                handleSendMessage();
            });

            // Enter Key
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSendMessage();
                }
            });
        }

        function renderCharacterList() {
            characterList.innerHTML = CHARACTERS.map(char => {
                const isActive = char.id === currentCharacter.id;
                return `
                    <button 
                        onclick="switchCharacter('${char.id}')"
                        class="w-full text-left p-3 rounded-2xl border-2 transition flex items-center gap-3 ${
                            isActive 
                            ? 'bg-peach-100/80 dark:bg-peach-900/40 border-peach-400 dark:border-peach-500 text-slate-800 dark:text-white shadow-sm' 
                            : 'bg-white/50 dark:bg-slate-800/30 border-peach-100/60 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:bg-peach-50 dark:hover:bg-slate-800'
                        }"
                    >
                        <span class="text-2xl shrink-0">${char.avatar}</span>
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center justify-between">
                                <h3 class="font-bold text-xs sm:text-sm truncate">${char.name}</h3>
                                <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-peach-50 dark:bg-slate-700 text-peach-500 dark:text-peach-300">${char.tagline}</span>
                            </div>
                            <p class="text-[11px] opacity-75 truncate mt-0.5">${char.description}</p>
                        </div>
                    </button>
                `;
            }).join('');
        }

        window.switchCharacter = function(charId) {
            const selected = CHARACTERS.find(c => c.id === charId);
            if (!selected) return;

            currentCharacter = selected;
            renderCharacterList();
            updateHeaderAndSuggestions();
            chatHistory = [];
            renderMessages();
            addWelcomeMessage();

            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
        };

        function updateHeaderAndSuggestions() {
            activeCharAvatar.innerText = currentCharacter.avatar;
            activeCharName.innerText = currentCharacter.name;
            activeCharDesc.innerText = currentCharacter.description;

            suggestionChips.innerHTML = currentCharacter.suggestions.map(sug => `
                <button 
                    onclick="sendPresetQuery('${sug.replace(/'/g, "\\'")}')" 
                    class="bounce-hover bounce-click text-xs font-semibold px-3 py-1.5 rounded-full bg-white dark:bg-darkCard border border-peach-200 dark:border-slate-700 text-peach-600 dark:text-peach-300 hover:bg-peach-50 dark:hover:bg-slate-800 transition shrink-0 flex items-center gap-1 shadow-sm"
                >
                    <span>💡</span>
                    <span>${sug}</span>
                </button>
            `).join('');
        }

        window.sendPresetQuery = function(text) {
            userInput.value = text;
            handleSendMessage();
        };

        function loadInitialChat() {
            updateHeaderAndSuggestions();
            addWelcomeMessage();
        }

        function addWelcomeMessage() {
            const welcomeText = `안녕하세요 {user}님! **${currentCharacter.name}**입니다. 🌸\n오늘 어떤 대화를 나누고 싶으신가요? 마음 편히 말씀해주세요!`;
            chatHistory.push({
                id: 'msg-' + Date.now(),
                role: 'model',
                text: welcomeText.replace(/{user}/g, userName),
                timestamp: getCurrentTime()
            });
            renderMessages();
        }

        // Smart Local Response Generator
        function generateLocalAIResponse(userQuery) {
            const cleanQuery = userQuery.toLowerCase().trim();

            // 1. Check matching database keywords
            for (const category of RESPONSES_DATABASE) {
                const match = category.keywords.some(kw => cleanQuery.includes(kw));
                if (match) {
                    const randomReply = category.replies[Math.floor(Math.random() * category.replies.length)];
                    return randomReply.replace(/{user}/g, userName);
                }
            }

            // 2. Fallback to dynamic template if no explicit keyword matches
            const randomFallback = FALLBACK_TEMPLATES[Math.floor(Math.random() * FALLBACK_TEMPLATES.length)];
            return randomFallback.replace(/{user}/g, userName);
        }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text || isGenerating) return;

            // Add User Message
            const userMsg = {
                id: 'msg-' + Date.now(),
                role: 'user',
                text: text,
                timestamp: getCurrentTime()
            };
            chatHistory.push(userMsg);

            userInput.value = '';
            userInput.style.height = 'auto';
            renderMessages();

            isGenerating = true;
            showTypingIndicator();

            // Simulate realistic AI thought process latency (0.6 ~ 1.2 sec)
            setTimeout(() => {
                removeTypingIndicator();
                const responseText = generateLocalAIResponse(text);

                chatHistory.push({
                    id: 'msg-' + Date.now(),
                    role: 'model',
                    text: responseText,
                    timestamp: getCurrentTime()
                });

                isGenerating = false;
                renderMessages();
            }, Math.floor(Math.random() * 600) + 600);
        }

        function renderMessages() {
            chatMessages.innerHTML = chatHistory.map(msg => {
                const isUser = msg.role === 'user';
                const formattedContent = marked.parse(msg.text);

                return `
                    <div class="flex gap-3 ${isUser ? 'flex-row-reverse' : 'flex-row'} items-start group">
                        <!-- Avatar -->
                        <div class="w-9 h-9 rounded-2xl ${isUser ? 'bg-butter-100 text-amber-700 border-2 border-butter-300' : 'bg-peach-100 dark:bg-peach-900/40 text-peach-500 border-2 border-peach-200 dark:border-peach-700'} flex items-center justify-center text-lg shrink-0 shadow-inner">
                            ${isUser ? '👤' : currentCharacter.avatar}
                        </div>

                        <!-- Bubble -->
                        <div class="max-w-[82%] sm:max-w-[75%] space-y-1">
                            <div class="flex items-center gap-2 ${isUser ? 'justify-end' : 'justify-start'} text-[10px] text-slate-400 px-1">
                                <span class="font-bold text-slate-600 dark:text-slate-300">${isUser ? userName : currentCharacter.name}</span>
                                <span>${msg.timestamp}</span>
                            </div>

                            <div class="p-3.5 sm:p-4 rounded-3xl ${
                                isUser 
                                ? 'bg-gradient-to-r from-peach-400 to-peach-500 text-white rounded-tr-sm shadow-md' 
                                : 'bg-white dark:bg-darkCard border-2 border-peach-100/80 dark:border-slate-800 text-slate-700 dark:text-slate-200 rounded-tl-sm shadow-sm'
                            } text-xs sm:text-sm leading-relaxed chat-content relative">
                                ${formattedContent}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            scrollToBottom();
        }

        function showTypingIndicator() {
            const typingHTML = `
                <div id="typingIndicator" class="flex gap-3 flex-row items-start">
                    <div class="w-9 h-9 rounded-2xl bg-peach-100 dark:bg-peach-900/40 text-peach-500 border-2 border-peach-200 flex items-center justify-center text-lg shrink-0">
                        ${currentCharacter.avatar}
                    </div>
                    <div class="p-3.5 bg-white dark:bg-darkCard border-2 border-peach-100 dark:border-slate-800 rounded-3xl rounded-tl-sm shadow-sm flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-peach-400 typing-dot"></span>
                        <span class="w-2 h-2 rounded-full bg-peach-400 typing-dot"></span>
                        <span class="w-2 h-2 rounded-full bg-peach-400 typing-dot"></span>
                    </div>
                </div>
            `;
            chatMessages.insertAdjacentHTML('beforeend', typingHTML);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        }
    </script>
</body>
</html>
