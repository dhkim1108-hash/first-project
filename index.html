<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>몽글 AI 챗봇 🐾 | Bubble AI Chat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cream: '#FFFDF9',
                        darkBg: '#12141C',
                        darkCard: '#1E2230',
                        peach: { 50: '#FFF5F3', 100: '#FFE8E5', 200: '#FFD3CD', 400: '#FF8E80', 500: '#FF6B5B', 600: '#E85242' },
                        mint: { 50: '#F0FDF8', 100: '#DCFCE7', 300: '#86EFAC', 500: '#34D399', 600: '#10B981' },
                        butter: { 100: '#FEF9C3', 300: '#FDE047', 400: '#FACC15' },
                        lavender: { 50: '#FAF5FF', 100: '#F3E8FF', 200: '#E9D5FF', 400: '#C084FC', 500: '#A855F7', 600: '#9333EA' }
                    },
                    fontFamily: {
                        cute: ['Gaegu', 'cursive'],
                        body: ['Gowun Dodum', 'sans-serif'],
                        num: ['Nunito', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Gowun Dodum', sans-serif;
        }

        /* Light Mode Pattern */
        body.light-mode {
            background-color: #FFFDF9;
            background-image: radial-gradient(#F3E8FF 1px, transparent 1px), radial-gradient(#FFE8E5 1px, #FFFDF9 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        /* Dark Mode Pattern */
        body.dark {
            background-color: #12141C;
            background-image: radial-gradient(#2E3448 1px, transparent 1px), radial-gradient(#1E2230 1px, #12141C 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        /* Cute Bouncy Hover Animations */
        .bounce-hover {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
        }
        .bounce-hover:hover {
            transform: translateY(-2px) scale(1.02);
        }

        .bounce-click:active {
            transform: scale(0.95);
        }

        /* Floating Mascot Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        .animate-float {
            animation: float 3.5s ease-in-out infinite;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFD3CD;
            border-radius: 99px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #3B4259;
        }

        /* Markdown Formatting Styles inside Chat */
        .chat-content p { margin-bottom: 0.5rem; }
        .chat-content p:last-child { margin-bottom: 0; }
        .chat-content ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.5rem; }
        .chat-content ol { list-style-type: decimal; margin-left: 1.25rem; margin-bottom: 0.5rem; }
        .chat-content code {
            background-color: rgba(255, 142, 128, 0.15);
            padding: 0.15rem 0.35rem;
            border-radius: 0.375rem;
            font-size: 0.85em;
            font-family: monospace;
        }
        .dark .chat-content code {
            background-color: rgba(255, 255, 255, 0.15);
        }
        .chat-content pre {
            background-color: #1E2230;
            color: #F3F4F6;
            padding: 0.75rem;
            border-radius: 0.75rem;
            overflow-x: auto;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            position: relative;
        }
        .chat-content pre code {
            background-color: transparent;
            padding: 0;
            color: inherit;
        }

        /* Typing Dots Animation */
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: translateY(0); opacity: 0.4; }
            50% { transform: translateY(-4px); opacity: 1; }
        }
    </style>
</head>

<body class="light-mode text-slate-700 dark:text-slate-200 min-h-screen flex flex-col justify-between selection:bg-peach-200 transition-colors duration-300">

    <div id="app" class="flex h-screen w-full overflow-hidden">
        
        <!-- Mobile Sidebar Overlay Backstage -->
        <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 lg:hidden hidden transition-opacity"></div>

        <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-50 w-80 bg-white/90 dark:bg-darkCard/95 backdrop-blur-md border-r-2 border-peach-100 dark:border-slate-800 flex flex-col justify-between transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out shadow-xl lg:shadow-none">
            
            <div class="p-5 flex flex-col h-full">
                <!-- Sidebar Header -->
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-2xl bg-peach-100 dark:bg-peach-900/30 border-2 border-peach-200 dark:border-peach-700 flex items-center justify-center text-peach-500 shadow-inner animate-float">
                            <span class="text-xl">🐾</span>
                        </div>
                        <div>
                            <h1 class="text-lg font-bold font-cute text-slate-800 dark:text-white tracking-wide">몽글 AI 챗봇</h1>
                            <p class="text-[11px] text-slate-400">포근한 감성 AI 대화 상대</p>
                        </div>
                    </div>
                    <!-- Close sidebar button (Mobile) -->
                    <button id="closeSidebarBtn" class="lg:hidden p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- New Conversation Button -->
                <button id="newChatBtn" class="w-full bounce-hover bounce-click bg-gradient-to-r from-peach-400 to-peach-500 hover:from-peach-500 hover:to-peach-600 text-white font-bold py-3 px-4 rounded-2xl shadow-lg shadow-peach-200 dark:shadow-none flex items-center justify-center gap-2 text-xs border-2 border-white/40 mb-6">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span>새 대화 시작하기</span>
                </button>

                <!-- AI Persona Selector List -->
                <div class="flex-grow overflow-y-auto space-y-3 pr-1">
                    <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 px-2 flex items-center gap-1">
                        <span>✨ AI 캐릭터 페르소나</span>
                    </div>

                    <div id="characterList" class="space-y-2">
                        <!-- Characters dynamically rendered here -->
                    </div>
                </div>

                <!-- Bottom Config & Actions -->
                <div class="pt-4 mt-auto border-t border-peach-100 dark:border-slate-800/80 space-y-2">
                    <!-- Theme Toggle -->
                    <button id="themeToggleBtn" class="w-full flex items-center justify-between p-3 rounded-2xl bg-peach-50/60 dark:bg-slate-800/60 hover:bg-peach-100 dark:hover:bg-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300 transition">
                        <span class="flex items-center gap-2">
                            <span id="themeIcon">🌙</span>
                            <span id="themeText">다크 모드로 전환</span>
                        </span>
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-white dark:bg-slate-700 text-slate-400">모드</span>
                    </button>

                    <!-- User Name Customization -->
                    <div class="p-3 rounded-2xl bg-peach-50/60 dark:bg-slate-800/60 flex items-center gap-2">
                        <span class="text-lg">👤</span>
                        <input type="text" id="userNameInput" value="몽글이친구" placeholder="내 이름 설정" class="w-full bg-transparent text-xs font-bold text-slate-700 dark:text-slate-200 focus:outline-none">
                    </div>

                    <!-- Clear Chat Button -->
                    <button id="clearChatBtn" class="w-full flex items-center justify-center gap-1.5 p-2 text-xs text-rose-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/30 rounded-xl transition font-medium">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        <span>현재 대화 내용 지우기</span>
                    </button>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full min-w-0 bg-transparent">
            
            <!-- Chat Top Header Bar -->
            <header class="h-16 border-b border-peach-100 dark:border-slate-800 bg-white/80 dark:bg-darkCard/80 backdrop-blur-md px-4 sm:px-6 flex items-center justify-between shrink-0 z-10">
                <div class="flex items-center gap-3">
                    <button id="openSidebarBtn" class="lg:hidden p-2 text-slate-500 hover:text-slate-700 dark:text-slate-300 rounded-xl bg-peach-50 dark:bg-slate-800">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>

                    <div class="flex items-center gap-2.5">
                        <span id="activeCharAvatar" class="text-2xl animate-float">🐾</span>
                        <div>
                            <h2 id="activeCharName" class="font-bold text-sm sm:text-base text-slate-800 dark:text-white flex items-center gap-1.5">
                                친절한 몽글이
                            </h2>
                            <p id="activeCharDesc" class="text-[11px] text-slate-400 truncate max-w-[200px] sm:max-w-xs">무엇이든 친절하고 따뜻하게 들어주는 몽글이</p>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold bg-mint-50 dark:bg-mint-950/40 text-mint-600 dark:text-mint-400 border border-mint-200 dark:border-mint-800">
                        <span class="w-2 h-2 rounded-full bg-mint-500 animate-pulse"></span>
                        <span>Gemini AI 준비됨</span>
                    </span>
                </div>
            </header>

            <div id="chatMessages" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
                <!-- Messages will be dynamically rendered here -->
            </div>

            <!-- Quick Suggestion Chips -->
            <div class="px-4 sm:px-6 py-2 overflow-x-auto no-scrollbar flex items-center gap-2 border-t border-peach-100/50 dark:border-slate-800/50 bg-white/40 dark:bg-darkCard/30 backdrop-blur-sm" id="suggestionChips">
                <!-- Dynamic Chips -->
            </div>

            <div class="p-3 sm:p-4 bg-white/80 dark:bg-darkCard/80 backdrop-blur-md border-t border-peach-100 dark:border-slate-800 shrink-0">
                <form id="chatForm" class="max-w-4xl mx-auto flex items-center gap-2">
                    <div class="relative flex-1 bg-peach-50/80 dark:bg-slate-800/80 rounded-2xl border-2 border-peach-100 dark:border-slate-700 focus-within:border-peach-400 dark:focus-within:border-peach-500 transition shadow-inner">
                        <textarea 
                            id="userInput" 
                            rows="1" 
                            placeholder="몽글이에게 마음을 전해보세요..." 
                            class="w-full px-4 py-3 bg-transparent text-sm text-slate-800 dark:text-slate-100 placeholder:text-slate-400 focus:outline-none resize-none max-h-32 leading-relaxed"
                        ></textarea>
                    </div>

                    <button 
                        type="submit" 
                        id="sendBtn"
                        class="bounce-hover bounce-click w-11 h-11 bg-gradient-to-r from-peach-400 to-peach-500 hover:from-peach-500 hover:to-peach-600 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-peach-200 dark:shadow-none shrink-0 border-2 border-white/50 transition disabled:opacity-50"
                    >
                        <i data-lucide="send" class="w-5 h-5"></i>
                    </button>
                </form>
                <div class="mt-1.5 text-center text-[10px] text-slate-400">
                    몽글이는 실수할 수 있어요. 답변 내용을 필요 시 확인해주세요! 🌸
                </div>
            </div>

        </main>
    </div>

    <script type="importmap">
    {
        "imports": {
            "@google/genai": "https://esm.run/@google/genai"
        }
    }
    </script>

    <script type="module">
        import { GoogleGenAI } from '@google/genai';

        // AI Personas Definition
        const CHARACTERS = [
            {
                id: 'monggle',
                name: '친절한 몽글이',
                avatar: '🐾',
                tagline: 'Warm & Helpful',
                description: '무엇이든 다정하고 포근하게 답변해주는 몽글이 마스코트예요.',
                systemInstruction: '당신은 "몽글이"라는 이름의 귀엽고 다정한 AI 마스코트입니다. 항상 따뜻하고 다정하게 말하며, 문장 끝에 "몽글!", "🐾", "🌸" 같은 귀여운 표현이나 이모지를 적절히 사용하세요.',
                suggestions: ['오늘 기분이 유난히 우울해 😭', '따뜻한 응원의 한마디 해줘!', '주말에 뭐하고 놀면 좋을까?']
            },
            {
                id: 'counselor',
                name: '따뜻한 상담사',
                avatar: '🧸',
                tagline: 'Empathetic Counselor',
                description: '지친 마음을 따뜻하게 경청하고 감싸주는 공감 전문 상담사입니다.',
                systemInstruction: '당신은 수용적이고 공감 능력 가득한 심리 상담사입니다. 사용자의 감정을 깊이 경청하고 비판 없이 다정하게 받아주세요.',
                suggestions: ['요즘 일 때문에 스트레스를 너무 많이 받아', '마음이 불안할 때 가라앉히는 법 알려줘', '나 스스로가 자꾸 부족하게 느껴져']
            },
            {
                id: 'summarizer',
                name: '족집게 요약가',
                avatar: '📑',
                tagline: 'Summarizer Expert',
                description: '긴 글이나 복잡한 내용을 명확하게 3줄로 핵심 요약해 드립니다.',
                systemInstruction: '당신은 명쾌한 요약 전문가입니다. 사용자가 전달하는 글이나 주제를 불렛 포인트와 핵심 키워드로 깔끔하게 구조화하여 요약해 주세요.',
                suggestions: ['인공지능의 역사에 대해 간단히 요약해줘', '업무 효율 올리는 핵심 팁 3가지', '블록체인의 기본 개념 정리해줘']
            },
            {
                id: 'english_tutor',
                name: '영어 회화 튜터',
                avatar: '🇬🇧',
                tagline: 'English Tutor',
                description: '자연스러운 영어 표현을 친절히 교정해주고 회화를 함께 연습해요.',
                systemInstruction: 'You are a friendly English conversation tutor. Respond in concise English, correct any mistakes gently, and explain key Korean meanings if helpful.',
                suggestions: ['Let\'s practice order coffee in English!', 'How can I say "퇴근길이라 차가 막혀요" in natural English?', 'Recommend 3 good idioms for daily conversations.']
            }
        ];

        // State Management
        let currentCharacter = CHARACTERS[0];
        let chatHistory = []; // Array of { id, role, text, timestamp }
        let isDarkMode = false;
        let userName = '몽글이친구';
        let isGenerating = false;

        // Initialize Gemini API Client
        // Note: process.env.GEMINI_API_KEY is handled seamlessly via SDK environment binding
        const apiKey = typeof process !== 'undefined' && process.env && process.env.GEMINI_API_KEY ? process.env.GEMINI_API_KEY : '';
        const ai = new GoogleGenAI({ apiKey: apiKey });

        // DOM Elements
        const characterList = document.getElementById('characterList');
        const activeCharAvatar = document.getElementById('activeCharAvatar');
        const activeCharName = document.getElementById('activeCharName');
        const activeCharDesc = document.getElementById('activeCharDesc');
        const chatMessages = document.getElementById('chatMessages');
        const suggestionChips = document.getElementById('suggestionChips');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const userNameInput = document.getElementById('userNameInput');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const newChatBtn = document.getElementById('newChatBtn');

        // Sidebar elements
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const openSidebarBtn = document.getElementById('openSidebarBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');

        window.addEventListener('DOMContentLoaded', () => {
            renderCharacterList();
            setupEventListeners();
            loadInitialChat();
            lucide.createIcons();
        });

        function setupEventListeners() {
            // Mobile Sidebar Toggles
            openSidebarBtn.addEventListener('click', () => {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            });

            closeSidebarBtn.addEventListener('click', closeSidebar);
            sidebarOverlay.addEventListener('click', closeSidebar);

            function closeSidebar() {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }

            // Theme Toggle
            themeToggleBtn.addEventListener('click', () => {
                isDarkMode = !isDarkMode;
                if (isDarkMode) {
                    document.body.classList.remove('light-mode');
                    document.body.classList.add('dark');
                    themeIcon.innerText = '☀️';
                    themeText.innerText = '라이트 모드로 전환';
                } else {
                    document.body.classList.remove('dark');
                    document.body.classList.add('light-mode');
                    themeIcon.innerText = '🌙';
                    themeText.innerText = '다크 모드로 전환';
                }
            });

            // User Name Change
            userNameInput.addEventListener('change', (e) => {
                userName = e.target.value.trim() || '몽글이친구';
            });

            // Clear Chat History
            clearChatBtn.addEventListener('click', () => {
                if (confirm('현재 대화 내용을 모두 지울까요? 🌸')) {
                    chatHistory = [];
                    renderMessages();
                    addWelcomeMessage();
                }
            });

            newChatBtn.addEventListener('click', () => {
                chatHistory = [];
                renderMessages();
                addWelcomeMessage();
                closeSidebar();
            });

            // Textarea auto-resize
            userInput.addEventListener('input', () => {
                userInput.style.height = 'auto';
                userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
            });

            // Submit Chat Form
            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                handleSendMessage();
            });

            // Enter key to send (Shift+Enter for newline)
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSendMessage();
                }
            });
        }

        function renderCharacterList() {
            characterList.innerHTML = CHARACTERS.map(char => {
                const isActive = char.id === currentCharacter.id;
                return `
                    <button 
                        onclick="switchCharacter('${char.id}')"
                        class="w-full text-left p-3 rounded-2xl border-2 transition flex items-center gap-3 ${
                            isActive 
                            ? 'bg-peach-100/80 dark:bg-peach-900/40 border-peach-400 dark:border-peach-500 text-slate-800 dark:text-white shadow-sm' 
                            : 'bg-white/50 dark:bg-slate-800/30 border-peach-100/60 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:bg-peach-50 dark:hover:bg-slate-800'
                        }"
                    >
                        <span class="text-2xl shrink-0">${char.avatar}</span>
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center justify-between">
                                <h3 class="font-bold text-xs sm:text-sm truncate">${char.name}</h3>
                                <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-peach-50 dark:bg-slate-700 text-peach-500 dark:text-peach-300">${char.tagline}</span>
                            </div>
                            <p class="text-[11px] opacity-75 truncate mt-0.5">${char.description}</p>
                        </div>
                    </button>
                `;
            }).join('');
        }

        window.switchCharacter = function(charId) {
            const selected = CHARACTERS.find(c => c.id === charId);
            if (!selected) return;

            currentCharacter = selected;
            renderCharacterList();
            updateHeaderAndSuggestions();
            chatHistory = [];
            renderMessages();
            addWelcomeMessage();

            // Close sidebar on mobile after selecting
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
        };

        function updateHeaderAndSuggestions() {
            activeCharAvatar.innerText = currentCharacter.avatar;
            activeCharName.innerText = currentCharacter.name;
            activeCharDesc.innerText = currentCharacter.description;

            // Render Suggestion Chips
            suggestionChips.innerHTML = currentCharacter.suggestions.map(sug => `
                <button 
                    onclick="sendPresetQuery('${sug.replace(/'/g, "\\'")}')" 
                    class="bounce-hover bounce-click text-xs font-semibold px-3 py-1.5 rounded-full bg-white dark:bg-darkCard border border-peach-200 dark:border-slate-700 text-peach-600 dark:text-peach-300 hover:bg-peach-50 dark:hover:bg-slate-800 transition shrink-0 flex items-center gap-1 shadow-sm"
                >
                    <span>💡</span>
                    <span>${sug}</span>
                </button>
            `).join('');
        }

        window.sendPresetQuery = function(text) {
            userInput.value = text;
            handleSendMessage();
        };

        function loadInitialChat() {
            updateHeaderAndSuggestions();
            addWelcomeMessage();
        }

        function addWelcomeMessage() {
            const welcomeText = `안녕하세요! **${currentCharacter.name}**입니다. 🌸\n오늘 어떤 도움이 필요하신가요? 편하게 말해주세요!`;
            chatHistory.push({
                id: 'msg-' + Date.now(),
                role: 'model',
                text: welcomeText,
                timestamp: getCurrentTime()
            });
            renderMessages();
        }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text || isGenerating) return;

            // Add user message
            const userMsg = {
                id: 'msg-' + Date.now(),
                role: 'user',
                text: text,
                timestamp: getCurrentTime()
            };
            chatHistory.push(userMsg);

            userInput.value = '';
            userInput.style.height = 'auto';
            renderMessages();

            // Show Typing Indicator
            isGenerating = true;
            showTypingIndicator();

            try {
                // Prepare API Payload with Google GenAI SDK
                // Construct turn history for multi-turn conversational context
                const contents = chatHistory.map(m => ({
                    role: m.role === 'user' ? 'user' : 'model',
                    parts: [{ text: m.text }]
                }));

                const response = await ai.models.generateContent({
                    model: 'gemini-3-flash-preview',
                    contents: contents,
                    config: {
                        systemInstruction: currentCharacter.systemInstruction,
                        temperature: 0.7
                    }
                });

                removeTypingIndicator();

                const aiText = response.text || '죄송해요, 잠시 생각을 정돈하지 못했어요 몽글... 다시 말씀해주실 수 있나요? 🐾';
                
                chatHistory.push({
                    id: 'msg-' + Date.now(),
                    role: 'model',
                    text: aiText,
                    timestamp: getCurrentTime()
                });

            } catch (err) {
                console.error('Gemini API Error:', err);
                removeTypingIndicator();
                chatHistory.push({
                    id: 'msg-' + Date.now(),
                    role: 'model',
                    text: '⚠️ 몽글이와의 연결이 잠시 불안정해요. 잠시 후 다시 시도해보세요!',
                    timestamp: getCurrentTime()
                });
            } finally {
                isGenerating = false;
                renderMessages();
            }
        }

        function renderMessages() {
            chatMessages.innerHTML = chatHistory.map(msg => {
                const isUser = msg.role === 'user';
                const formattedContent = marked.parse(msg.text);

                return `
                    <div class="flex gap-3 ${isUser ? 'flex-row-reverse' : 'flex-row'} items-start group">
                        <!-- Avatar -->
                        <div class="w-9 h-9 rounded-2xl ${isUser ? 'bg-butter-100 text-amber-700 border-2 border-butter-300' : 'bg-peach-100 dark:bg-peach-900/40 text-peach-500 border-2 border-peach-200 dark:border-peach-700'} flex items-center justify-center text-lg shrink-0 shadow-inner">
                            ${isUser ? '👤' : currentCharacter.avatar}
                        </div>

                        <!-- Bubble -->
                        <div class="max-w-[82%] sm:max-w-[75%] space-y-1">
                            <div class="flex items-center gap-2 ${isUser ? 'justify-end' : 'justify-start'} text-[10px] text-slate-400 px-1">
                                <span class="font-bold text-slate-600 dark:text-slate-300">${isUser ? userName : currentCharacter.name}</span>
                                <span>${msg.timestamp}</span>
                            </div>

                            <div class="p-3.5 sm:p-4 rounded-3xl ${
                                isUser 
                                ? 'bg-gradient-to-r from-peach-400 to-peach-500 text-white rounded-tr-sm shadow-md' 
                                : 'bg-white dark:bg-darkCard border-2 border-peach-100/80 dark:border-slate-800 text-slate-700 dark:text-slate-200 rounded-tl-sm shadow-sm'
                            } text-xs sm:text-sm leading-relaxed chat-content relative">
                                ${formattedContent}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Code Block Copy Button Helper
            setupCodeCopyButtons();
            scrollToBottom();
        }

        function showTypingIndicator() {
            const typingHTML = `
                <div id="typingIndicator" class="flex gap-3 flex-row items-start">
                    <div class="w-9 h-9 rounded-2xl bg-peach-100 dark:bg-peach-900/40 text-peach-500 border-2 border-peach-200 flex items-center justify-center text-lg shrink-0">
                        ${currentCharacter.avatar}
                    </div>
                    <div class="p-3.5 bg-white dark:bg-darkCard border-2 border-peach-100 dark:border-slate-800 rounded-3xl rounded-tl-sm shadow-sm flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-peach-400 typing-dot"></span>
                        <span class="w-2 h-2 rounded-full bg-peach-400 typing-dot"></span>
                        <span class="w-2 h-2 rounded-full bg-peach-400 typing-dot"></span>
                    </div>
                </div>
            `;
            chatMessages.insertAdjacentHTML('beforeend', typingHTML);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function setupCodeCopyButtons() {
            const pres = chatMessages.querySelectorAll('pre');
            pres.forEach(pre => {
                if (pre.querySelector('.copy-btn')) return;

                const btn = document.createElement('button');
                btn.className = 'copy-btn absolute top-2 right-2 px-2 py-1 text-[10px] font-bold bg-slate-700 text-slate-200 rounded-md hover:bg-slate-600 transition opacity-80 hover:opacity-100';
                btn.innerText = '복사 📋';
                btn.onclick = () => {
                    const code = pre.querySelector('code')?.innerText || pre.innerText;
                    navigator.clipboard.writeText(code);
                    btn.innerText = '완료! ✨';
                    setTimeout(() => btn.innerText = '복사 📋', 2000);
                };
                pre.style.position = 'relative';
                pre.appendChild(btn);
            });
        }

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        }
    </script>
</body>
</html>
