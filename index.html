    <style>
        body {
            font-family: 'Gowun Dodum', sans-serif;
        }

        /* Light Mode Cute Dot Pattern */
        body.light-mode {
            background-color: #FFFDF9;
            background-image: radial-gradient(#F3E8FF 1.5px, transparent 1.5px), radial-gradient(#FFE8E5 1.5px, #FFFDF9 1.5px);
            background-size: 36px 36px;
            background-position: 0 0, 18px 18px;
        }

        /* Dark Mode Dot Pattern */
        body.dark {
            background-color: #12141C;
            background-image: radial-gradient(#2E3448 1.5px, transparent 1.5px), radial-gradient(#1E2230 1.5px, #12141C 1.5px);
            background-size: 36px 36px;
            background-position: 0 0, 18px 18px;
        }

        /* Animations */
        .bounce-hover {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
        }
        .bounce-hover:hover {
            transform: translateY(-2px) scale(1.02);
        }
        .bounce-click:active {
            transform: scale(0.95);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-7px) rotate(2deg); }
        }
        .animate-float {
            animation: float 3.5s ease-in-out infinite;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFD3CD;
            border-radius: 99px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #3B4259;
        }

        /* Chat Markdown Styles */
        .chat-content p { margin-bottom: 0.5rem; }
        .chat-content p:last-child { margin-bottom: 0; }
        .chat-content ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.5rem; }
        .chat-content ol { list-style-type: decimal; margin-left: 1.25rem; margin-bottom: 0.5rem; }
        .chat-content code {
            background-color: rgba(255, 142, 128, 0.18);
            padding: 0.15rem 0.35rem;
            border-radius: 0.375rem;
            font-size: 0.85em;
            font-family: monospace;
        }
        .dark .chat-content code {
            background-color: rgba(255, 255, 255, 0.18);
        }

        /* Typing Dots Animation */
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: translateY(0); opacity: 0.4; }
            50% { transform: translateY(-4px); opacity: 1; }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

        }

        function addWelcomeMessage() {
            const welcomeText = `안녕하세요 {user}님! **${currentCharacter.name}**입니다. 🌸\n오늘 어떤 대화를 나누고 싶으신가요? 마음 편히 궁금한 이야기나 퀴즈를 요청해주세요!`;
            chatHistory.push({
                id: 'msg-' + Date.now(),
                role: 'model',
                text: welcomeText.replace(/{user}/g, userName),
                timestamp: getCurrentTime()
            });
            renderMessages();
        }

        // SMART CONTEXT-AWARE RESPONSE GENERATOR (HANDLES QUIZZES & HUNDREDS OF INTENTS)
        function processSmartResponse(userQuery) {
            const cleanQuery = userQuery.toLowerCase().replace(/\s+/g, '').trim();
            const rawQuery = userQuery.toLowerCase().trim();

            // 1. CONTEXT CHECK: IS THERE AN ACTIVE QUIZ SESSION?
            if (activeQuiz) {
                const isCorrect = activeQuiz.answers.some(ans => {
                    const cleanAns = ans.toLowerCase().replace(/\s+/g, '');
                    return cleanQuery.includes(cleanAns) || cleanAns.includes(cleanQuery);
                });

                if (isCorrect) {
                    const celebrationText = activeQuiz.explanation;
                    activeQuiz = null; // Quiz completed!
                    updateQuizBadge();

                    // Fire Confetti!
                    try {
                        confetti({
                            particleCount: 80,
                            spread: 60,
                            origin: { y: 0.7 }
                        });
                    } catch(e){}

                    return `${celebrationText}\n\n다른 퀴즈를 더 풀어보고 싶으시다면 **"퀴즈 내줘"** 라고 말해 주세요! 💡`;
                }

                // Check if user is giving up or asking for answer
                if (cleanQuery.includes('포기') || cleanQuery.includes('정답뭐') || cleanQuery.includes('몰라') || cleanQuery.includes('힌트')) {
                    if (cleanQuery.includes('힌트')) {
                        return `💡 **힌트 요청!**\n이 퀴즈의 정답은 **"${activeQuiz.answers[0].charAt(0)}..."** 으로 시작해요! 조금만 더 생각해보세요! 🐾`;
                    } else {
                        const answerText = activeQuiz.answers[0];
                        activeQuiz = null;
                        updateQuizBadge();
                        return `아쉽네요! 정답은 바로 **'${answerText}'** 이었습니다! 🤭 다음 문제에서는 꼭 맞혀봐요! 퀴즈가 더 필요하시면 말씀해주세요!`;
                    }
                }
            }

            // 2. CHECK IF USER WANTS A NEW QUIZ
            if (rawQuery.includes('퀴즈') || rawQuery.includes('문제') || rawQuery.includes('맞춰볼까') || rawQuery.includes('게임')) {
                // Select a random quiz from the Quiz Bank
                const randomQuiz = QUIZ_BANK[Math.floor(Math.random() * QUIZ_BANK.length)];
                activeQuiz = randomQuiz;
                updateQuizBadge();
                return `${randomQuiz.question}\n\n*(정답을 아시겠다면 단어를 그대로 적어보세요!)*`;
            }

            // 3. KEYWORD & CATEGORY MATCHING ENGINE
            for (const cat of RESPONSE_CATEGORIES) {
                const matched = cat.keywords.some(kw => rawQuery.includes(kw) || cleanQuery.includes(kw.replace(/\s+/g, '')));
                if (matched) {
                    const selectedReply = cat.replies[Math.floor(Math.random() * cat.replies.length)];
                    return selectedReply.replace(/{user}/g, userName);
                }
            }

            // 4. SMART DYNAMIC FALLBACK
            const randomFallback = GENERIC_FALLBACK_PATTERNS[Math.floor(Math.random() * GENERIC_FALLBACK_PATTERNS.length)];
            return randomFallback.replace(/{user}/g, userName);
        }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text || isGenerating) return;

            // Add User Message
            const userMsg = {
                id: 'msg-' + Date.now(),
                role: 'user',
                text: text,
                timestamp: getCurrentTime()
            };
            chatHistory.push(userMsg);

            userInput.value = '';
            userInput.style.height = 'auto';
            renderMessages();

            isGenerating = true;
            showTypingIndicator();

            // Simulate realistic AI thought process latency
            setTimeout(() => {
                removeTypingIndicator();
                const responseText = processSmartResponse(text);

                chatHistory.push({
                    id: 'msg-' + Date.now(),
                    role: 'model',
                    text: responseText,
                    timestamp: getCurrentTime()
                });

                isGenerating = false;
                renderMessages();
            }, Math.floor(Math.random() * 400) + 400);
        }

        function renderMessages() {
            chatMessages.innerHTML = chatHistory.map(msg => {
                const isUser = msg.role === 'user';
                const formattedContent = marked.parse(msg.text);

                return `
                    <div class="flex gap-3 ${isUser ? 'flex-row-reverse' : 'flex-row'} items-start group">
                        <!-- Avatar -->
                        <div class="w-9 h-9 rounded-2xl ${isUser ? 'bg-butter-100 text-amber-700 border-2 border-butter-300' : 'bg-peach-100 dark:bg-peach-900/40 text-peach-500 border-2 border-peach-200 dark:border-peach-700'} flex items-center justify-center text-lg shrink-0 shadow-inner">
                            ${isUser ? '👤' : currentCharacter.avatar}
                        </div>

                        <!-- Bubble -->
                        <div class="max-w-[82%] sm:max-w-[75%] space-y-1">
                            <div class="flex items-center gap-2 ${isUser ? 'justify-end' : 'justify-start'} text-[10px] text-slate-400 px-1">
                                <span class="font-bold text-slate-600 dark:text-slate-300">${isUser ? userName : currentCharacter.name}</span>
                                <span>${msg.timestamp}</span>
                            </div>

                            <div class="p-3.5 sm:p-4 rounded-3xl ${
                                isUser 
                                ? 'bg-gradient-to-r from-peach-400 to-peach-500 text-white rounded-tr-sm shadow-md' 
                                : 'bg-white dark:bg-darkCard border-2 border-peach-100/80 dark:border-slate-800 text-slate-700 dark:text-slate-200 rounded-tl-sm shadow-sm'
                            } text-xs sm:text-sm leading-relaxed chat-content relative">
                                ${formattedContent}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            scrollToBottom();
        }

        function showTypingIndicator() {
            const typingHTML = `
                <div id="typingIndicator" class="flex gap-3 flex-row items-start">
                    <div class="w-9 h-9 rounded-2xl bg-peach-100 dark:bg-peach-900/40 text-peach-500 border-2 border-peach-200 flex items-center justify-center text-lg shrink-0">
                        ${currentCharacter.avatar}
                    </div>
                    <div class="p-3.5 bg-white dark:bg-darkCard border-2 border-peach-100 dark:border-slate-800 rounded-3xl rounded-tl-sm shadow-sm flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-peach-400 typing-dot"></span>
                        <span class="w-2 h-2 rounded-full bg-peach-400 typing-dot"></span>
                        <span class="w-2 h-2 rounded-full bg-peach-400 typing-dot"></span>
                    </div>
                </div>
            `;
            chatMessages.insertAdjacentHTML('beforeend', typingHTML);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        }
    </script>
</body>
</html>
